# wego 四系统 HTTPS 配置：放到 /etc/nginx/conf.d/wego.conf
# 前提：/etc/nginx/nginx.conf 的 http {} 里有 include /etc/nginx/conf.d/*.conf;
# 证书：五个域名签在同一张证书里，目录为 /etc/letsencrypt/live/sso.xzyang.cn/
# 如果以后改成每个子域单独签证书，把下面五处 ssl_certificate/ssl_certificate_key 改成对应目录。

# ---------- HTTP：ACME 续期校验 + 跳转 HTTPS ----------

server {
    listen 80;
    server_name sso.xzyang.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name mockup.xzyang.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name cad.xzyang.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name quiz.xzyang.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name files.xzyang.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：单点登录 ----------

server {
    listen 443 ssl;
    server_name sso.xzyang.cn;

    ssl_certificate     /etc/letsencrypt/live/sso.xzyang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.xzyang.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/others/deployWego/wego/frontend/sso;
    index index.html;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}

# ---------- HTTPS：包装样机 ----------

server {
    listen 443 ssl;
    server_name mockup.xzyang.cn;

    ssl_certificate     /etc/letsencrypt/live/sso.xzyang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.xzyang.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/others/deployWego/wego/frontend/mockup;
    index index.html;
    client_max_body_size 32m;

    location = /share { try_files /share.html =404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}

# ---------- HTTPS：三维建模 ----------

server {
    listen 443 ssl;
    server_name cad.xzyang.cn;

    ssl_certificate     /etc/letsencrypt/live/sso.xzyang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.xzyang.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/others/deployWego/wego/frontend/cad;
    index index.html;
    client_max_body_size 32m;

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}

